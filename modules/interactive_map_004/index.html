<title>Нижний Новгород — Владимир: начало дороги в XIV веке</title>
<style>
:root{--ink:#2f2924;--muted:#71675d;--paper:#f4efd9;--panel:#f7f1de;--line:#8b2635;--gold:#d8a83a;--gold2:#ffe5a0;--dark:#3a2d27;--border:rgba(75,57,45,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#e8e0c8;color:var(--ink)}button{font:inherit}
.shell{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr);overflow:hidden;background:var(--paper)}
.header{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--dark);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{font-size:12px;opacity:.72;margin-left:auto;white-space:nowrap}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.map-pane{min-width:0;min-height:0;position:relative;overflow:hidden;background:#dcd4b9;touch-action:none}
.map-stage{position:absolute;inset:0;transform-origin:center center;will-change:transform}.map-svg{width:100%;height:100%;display:block}
.base{pointer-events:none}.route{fill:none;stroke:#a92d43;stroke-width:45;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:155 95;animation:dash 4s linear infinite;filter:drop-shadow(0 0 2px rgba(255,255,255,.55));pointer-events:none}.route-under{fill:none;stroke:rgba(255,244,214,.72);stroke-width:70;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-250}}
.marker{cursor:pointer}.marker .pulse{fill:rgba(216,168,58,.14);stroke:var(--gold);stroke-width:22;transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}.marker .core{fill:var(--gold);stroke:#fff1bf;stroke-width:22}.marker:hover .core,.marker.active .core{fill:var(--gold2);stroke:#8d6216;stroke-width:28}.marker.monastery .pulse{animation-duration:2.35s}.marker.monastery .core{fill:#8b2635;stroke:var(--gold2);stroke-width:24}.marker.monastery.active .core{fill:var(--gold)}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}70%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
.layer-controls{position:absolute;left:14px;top:14px;display:flex;gap:8px;z-index:4;flex-wrap:wrap}.chip{border:1px solid rgba(75,57,45,.22);background:rgba(247,241,222,.93);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer;box-shadow:0 2px 10px rgba(55,39,27,.10)}.chip[aria-pressed="true"]{background:#4b382e;color:#fff;border-color:#4b382e}.zoom{position:absolute;right:14px;bottom:14px;z-index:4;display:flex;gap:6px}.zoom button{width:38px;height:38px;border:1px solid var(--border);border-radius:9px;background:rgba(247,241,222,.95);cursor:pointer;color:var(--ink);font-weight:700}
.panel{min-width:0;min-height:0;overflow:auto;background:var(--panel);border-left:1px solid var(--border)}.panel-inner{padding:18px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9a7426;font-weight:700}.panel h2{font-size:25px;line-height:1.1;margin:6px 0 9px}.period{font-size:13px;color:var(--muted);margin-bottom:14px}.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#ddd3b7}.caption{font-size:11px;color:var(--muted);margin:5px 1px 14px;line-height:1.35}.body{font-size:14px;line-height:1.5}.body p{margin:0 0 11px}.note{padding:10px 11px;border-left:3px solid var(--gold);background:rgba(216,168,58,.10);font-size:12px;line-height:1.45;margin:14px 0}.sources{border-top:1px solid var(--border);margin-top:16px;padding-top:12px}.sources strong{font-size:12px}.sources a{display:block;font-size:11px;line-height:1.35;color:#74531b;margin-top:7px;word-break:break-word}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}.legend-item{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}.dot.mon{background:#8b2635;border:2px solid var(--gold);width:11px;height:11px}.empty{display:flex;min-height:100%;flex-direction:column;justify-content:center}.empty h2{margin-bottom:10px}.empty p{color:var(--muted);font-size:14px;line-height:1.5}
@media(max-width:760px){
 html,body{width:100vw;max-width:100vw;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
 .shell{width:100vw;max-width:100vw;height:100dvh;grid-template-rows:50px minmax(0,1fr);overflow:hidden}
 .header{min-width:0;padding:0 12px}.title{min-width:0}.subtitle{display:none}
 .main{width:100%;max-width:100%;min-width:0;min-height:0;overflow:hidden;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,52%) minmax(0,48%)}
 .map-pane{width:100%;max-width:100%;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
 .map-stage{position:relative;inset:auto;width:100%;max-width:100%;height:auto;aspect-ratio:19800/13600;flex:0 0 auto;transform-origin:center center}
 .map-svg{display:block;width:100%;max-width:100%;height:100%;max-height:100%}
 .panel{width:100%;max-width:100%;min-width:0;min-height:0;border-left:0;border-top:1px solid var(--border);overflow-y:auto;overflow-x:hidden}
 .panel-inner,.empty{width:100%;max-width:100%;min-width:0}
 .panel-inner{padding:14px;overflow-wrap:break-word;word-break:normal}
 .empty p,.body,.note,.caption,.period,.sources,.sources a{max-width:100%;overflow-wrap:break-word;word-break:normal}
 .legend{grid-template-columns:repeat(2,minmax(0,1fr));width:100%;max-width:100%}.legend-item{min-width:0}
 .panel h2{font-size:21px}
 .layer-controls{top:8px;left:8px;right:8px;width:auto;max-width:calc(100% - 16px);gap:6px;flex-wrap:wrap}
 .chip{padding:7px 10px;font-size:12px}
 .zoom{display:none}.body{font-size:13px}.hero{aspect-ratio:16/8}.sources a{font-size:10px}
}
@media(max-width:760px) and (orientation:landscape){.main{grid-template-columns:66% 34%;grid-template-rows:1fr}.panel{border-left:1px solid var(--border);border-top:0}.hero{aspect-ratio:16/9}}
</style>

<body>
<div class="shell">
  <header class="header"><div class="title">Начало дороги Нижний Новгород — Владимир в XIV веке</div><div class="subtitle">Интерактивная историческая схема</div></header>
  <main class="main">
    <section class="map-pane" id="mapPane" aria-label="Историческая карта">
      <div class="layer-controls">
        <button class="chip" id="citiesToggle" aria-pressed="true">Города и селения</button>
        <button class="chip" id="monToggle" aria-pressed="true">Монастыри</button>
        <button class="chip" id="routeToggle" aria-pressed="true">Путь</button>
      </div>
      <div class="map-stage" id="stage">
        <svg class="map-svg" viewBox="650 8950 19800 13600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Схема начала дороги Нижний Новгород — Владимир в XIV веке">
          <image class="base" href="assets/map.png" x="853" y="9115" width="19406" height="13284" preserveAspectRatio="none" />
          <g id="routeLayer">
            <path class="route-under" d="M1397 17385c1023,-14 3072,1596 5404,2414 1137,399 2599,189 4407,-33 807,-124 1615,-97 2423,32 1233,-99 2496,-176 3154,-677 -552,-92 -919,-276 -1302,-508l117 -1503c67,-240 91,-491 105,-730 621,-840 702,-2092 1355,-2509 484,-1377 958,-1829 751,-2391 -446,-442 -922,-871 -1788,-1419"/>
            <path class="route" d="M1397 17385c1023,-14 3072,1596 5404,2414 1137,399 2599,189 4407,-33 807,-124 1615,-97 2423,32 1233,-99 2496,-176 3154,-677 -552,-92 -919,-276 -1302,-508l117 -1503c67,-240 91,-491 105,-730 621,-840 702,-2092 1355,-2509 484,-1377 958,-1829 751,-2391 -446,-442 -922,-871 -1788,-1419"/>
          </g>
          <g id="citiesLayer"></g>
          <g id="monLayer"></g>
        </svg>
      </div>
      <div class="zoom"><button id="zoomOut" aria-label="Уменьшить">−</button><button id="zoomReset" aria-label="Сбросить масштаб">1:1</button><button id="zoomIn" aria-label="Увеличить">+</button></div>
    </section>
    <aside class="panel"><div class="panel-inner" id="panel"></div></aside>
  </main>
</div>
<script>
const data = {
  cities: [
    {id:'nizhny',name:'Нижний Новгород',x:15536,y:10319,img:'assets/historic/nizhny.jpg',caption:'Нижний Новгород. Вид от Ивановской башни на Рождественскую улицу и Стрелку, конец 1890-х. Фото М. П. Дмитриева.',period:'XIV век',html:`<p>Нижний Новгород был основан в 1221 году у слияния Оки и Волги. Во второй половине XIV века город стал одним из ведущих политических центров Северо-Восточной Руси и столицей Нижегородско-Суздальского княжества.</p><p>Положение на двух крупнейших речных путях делало город естественным узлом сухопутных и водных коммуникаций. Именно отсюда реконструкция выводит дорогу в сторону Владимира.</p>`,sources:['https://archaeolog.ru/press/pubs/n513']},
    {id:'vysokovo',name:'Высоково',x:17031,y:13873,img:'assets/historic/vysokovo.png',caption:'Троицкая церковь в Высокове. Каменный храм начала XIX века на месте старого монастырского села.',period:'XIV век',html:`<p>По истории местного Троицкого прихода, Высоково возникло в XIV столетии на землях Нижегородского Печерского монастыря.</p><p>Это делает Высоково одним из немногих современных топонимов на схеме, для которого существует прямая местная традиция, связывающая поселение с эпохой формирования дороги.</p>`,sources:['https://vysokovoprihod.ru/istoriya-hrama/']},
    {id:'kuznechikha',name:'Кузнечиха',x:15668,y:16389,img:'assets/historic/kuznechikha.jpg',caption:'Дом Дубовкина в деревне Кузнечиха — памятник деревянной застройки XIX века.',period:'Реконструкция XIV века',html:`<p>Кузнечиха обозначена на карте современным названием, чтобы привязать предполагаемую трассу к нынешней местности.</p><p>Надёжное документальное свидетельство о деревне относится к значительно более позднему времени: она зафиксирована на плане Генерального межевания Нижегородского уезда 1780 года. Поэтому существование поселения под этим названием в XIV веке утверждать нельзя.</p>`,sources:['https://ru.wikipedia.org/wiki/Кузнечиха_(городской_округ_город_Нижний_Новгород)']},
    {id:'novopokrovskoe',name:'Новопокровское',x:15639,y:17074,img:'assets/historic/novopokrovskoe.jpg',caption:'Деревянный дом в Новопокровском. Фото 2008 года; пример сохранившейся традиционной застройки.',period:'Реконструкция XIV века',html:`<p>На схеме используется современный топоним. Самые ранние обнаруженные письменные сведения относятся к пустоши Грабилово — предшественнице Новопокровского — и датируются концом XVI века.</p><p>Поэтому точка служит прежде всего географическим ориентиром реконструируемого средневекового маршрута.</p>`,sources:['https://ru.wikipedia.org/wiki/Новопокровское_(Нижний_Новгород)']},
    {id:'utechino',name:'Утечино',x:15568,y:17590,img:'assets/historic/utechino.jpg',caption:'Деревянная церковь в Утечине. Фото 2006 года; историческая застройка местности.',period:'Реконструкция XIV века',html:`<p>Утечино показано как современный ориентир на предполагаемой линии дороги. В доступных справочных источниках не удалось найти надёжного свидетельства существования деревни именно в XIV веке.</p><p>Для исторической реконструкции важно различать древнюю трассу и современные названия местности: последнее не означает, что поселение уже существовало под тем же именем.</p>`,sources:['https://ru.ruwiki.ru/wiki/Утечино_(Нижегородская_область)']},
    {id:'fedyakovo',name:'Федяково',x:15496,y:18593,img:'assets/historic/fedyakovo.jpg',caption:'Церковь в Федякове. Современный снимок историко-религиозного ландшафта села.',period:'Реконструкция XIV века',html:`<p>Федяково расположено на юго-восточном направлении от Нижнего Новгорода и на карте выступает современным ориентиром предполагаемой дороги.</p><p>Проверенные открытые справочники не дают основания уверенно датировать поселение XIV веком, поэтому его средневековый статус в модуле не утверждается.</p>`,sources:['https://ru.wikipedia.org/wiki/Федяково_(Нижегородская_область)']},
    {id:'bolshaya_elnya',name:'Большая Ельня',x:16663,y:19130,img:'assets/historic/bolshaya_elnya.jpg',caption:'Церковь Николая Чудотворца в Большой Ельне. Архивная фотография 1947 года.',period:'Реконструкция XIV века',html:`<p>Большая Ельня нанесена на карту современным названием. Открытые источники подробно фиксируют более позднюю историю села, в том числе храм Николая Чудотворца конца XVIII века, но не дают достоверной привязки поселения к XIV столетию.</p><p>В интерактиве точка используется как географический маркер реконструируемого пути.</p>`,sources:['https://ru.wikipedia.org/wiki/Большая_Ельня']},
    {id:'rumyantsevo',name:'Румянцево',x:13670,y:19763,img:'assets/historic/rural_nn_1892.jpg',caption:'Сельский быт Нижегородской губернии, 1891–1892. Фото М. П. Дмитриева. Контекстная иллюстрация: точного архивного вида Румянцева в открытых коллекциях не найдено.',period:'Реконструкция XIV века',html:`<p>Румянцево — современная деревня к юго-востоку от Нижнего Новгорода. В доступных открытых материалах не обнаружено надёжной XIV-вековой аттестации этого названия.</p><p>Поэтому на карте оно выполняет роль современного пространственного ориентира, по которому читатель может сопоставить историческую схему с нынешней географией.</p>`,sources:['https://ru.wikipedia.org/wiki/Румянцево_(Кстовский_район)']},
    {id:'blizhnee_borisovo',name:'Ближнее Борисово',x:11144,y:19792,img:'assets/historic/blizhnee_borisovo.jpg',caption:'Покровская церковь в Ближнем Борисове. Архивная фотография конца XIX — начала XX века, М. П. Дмитриев.',period:'Реконструкция XIV века',html:`<p>Ближнее Борисово показано под современным названием. Доступные краеведческие материалы уверенно фиксируют село на картах XIX века, однако этого недостаточно, чтобы переносить топоним в XIV столетие.</p><p>В модуле точка используется как современная привязка к предполагаемой трассе дороги.</p>`,sources:['https://staraya-derevnia.ru/кстовский-район/с-ближнее-борисово/']},
    {id:'olgino',name:'Ольгино',x:9538,y:16498,img:'assets/historic/rural_nn_1892.jpg',caption:'Сельский быт Нижегородской губернии, 1891–1892. Фото М. П. Дмитриева. Контекстная иллюстрация: достоверного старого вида именно Ольгина не найдено.',period:'Современный ориентир',html:`<p>Современное Ольгино возникло гораздо позже рассматриваемой эпохи: справочные материалы относят основание деревни к 1840-м годам.</p><p>Поэтому эта точка особенно наглядно показывает принцип карты: часть подписей — современные ориентиры вдоль реконструируемой линии пути, а не перечень XIV-вековых поселений.</p>`,sources:['https://ru.wikipedia.org/wiki/Ольгино_(Нижний_Новгород)']},
    {id:'blizhnekonstantinovo',name:'Ближнеконстантиново',x:11064,y:18538,img:'assets/historic/rural_nn_1892.jpg',caption:'Сельский быт Нижегородской губернии, 1891–1892. Фото М. П. Дмитриева. Контекстная иллюстрация: архивный вид Ближнеконстантинова не установлен.',period:'Реконструкция XIV века',html:`<p>Ближнеконстантиново нанесено как современный населённый пункт на линии предполагаемой дороги. Доступные административные источники подтверждают существование деревни в современный период, но не позволяют уверенно датировать её XIV столетием.</p><p>Поэтому в исторической интерпретации точка используется как географический ориентир, без утверждения о непрерывности поселения с XIV века.</p>`,sources:['https://www.nn-gov.ru/doc/123261']}
  ],
  monasteries:[
    {id:'blag',name:'Благовещенский монастырь',x:12015,y:11950,img:'assets/historic/blag.jpg',caption:'Благовещенский монастырь Нижнего Новгорода, 1887–1890. Фото М. П. Дмитриева.',period:'1221 — вторая половина XIV века',html:`<p>Благовещенский монастырь традиционно считается ровесником Нижнего Новгорода и связывается с основанием города в 1221 году. Уже в 1229 году обитель была разорена во время нападения князя Пургаса.</p><p>После длительного упадка монастырь был возобновлён во второй половине XIV века. На карте он важен как один из древнейших духовных центров у выхода из города на правом берегу Оки.</p>`,sources:['https://old.bigenc.ru/fine_art/text/3832642','https://nne.ru/objects/blagoveshhenskij-muzhskoj-monastyr/']},
    {id:'pech',name:'Вознесенский Печерский монастырь',x:18294,y:11370,img:'assets/historic/pech.jpg',caption:'Печерский Вознесенский монастырь, 1890–1900-е годы. Архивная фотография.',period:'около 1328–1330 годов',html:`<p>Печерская обитель возникла на рубеже 1320–1330-х годов. Её основателем считается монах Дионисий, пришедший из Киево-Печерского монастыря и устроивший первые кельи-пещеры на волжском склоне.</p><p>К концу XIV века монастырь стал заметным духовным центром Нижегородской земли. С ним связаны ученики Дионисия и развитие книжной культуры региона.</p>`,sources:['https://www.pecherskiy.nne.ru/ob-obiteli/letopis-monastyirya.html','https://ar.culture.ru/ru/subject/nizhegorodskiy-voznesenskiy-pecherskiy-monastyr']},
    {id:'dudin',name:'Амвросиев Николаевский Дудин монастырь',x:9125,y:17750,img:'assets/historic/rural_nn_1892.jpg',caption:'Нижегородская губерния, 1891–1892. Временная контекстная иллюстрация; для Дудина монастыря в источниках известны фотографии 1912 года, их оригинал будет подключён после получения пригодного файла.',period:'конец XIV — начало XV века',html:`<p>Первое письменное упоминание Дудина монастыря относится к 1408 году. Официальная история обители допускает его возникновение во второй половине XIV столетия, когда на Нижегородской земле развивалась сеть монастырей.</p><p>Монастырь находился на высоком правом берегу Оки и был связан с важнейшим речным и сухопутным коридором. Предание также связывает это место с путешествием Сергия Радонежского.</p>`,sources:['https://dudinmon.ru/history','https://nne.ru/objects/arhierejskoe-podvore-byvshego-svyato-nikolskogo-amvrosieva-dudina-muzhskogo-monastyrya-s-podyablonnoe/']}
  ]
};
const ns='http://www.w3.org/2000/svg';
const panel=document.getElementById('panel');
function makeMarker(item,type){const g=document.createElementNS(ns,'g');g.setAttribute('class','marker '+(type==='monasteries'?'monastery':''));g.dataset.id=item.id;g.dataset.type=type;g.setAttribute('role','button');g.setAttribute('aria-label',item.name);const p=document.createElementNS(ns,'circle');p.setAttribute('class','pulse');p.setAttribute('cx',item.x);p.setAttribute('cy',item.y);p.setAttribute('r',type==='monasteries'?220:185);const c=document.createElementNS(ns,'circle');c.setAttribute('class','core');c.setAttribute('cx',item.x);c.setAttribute('cy',item.y);c.setAttribute('r',type==='monasteries'?120:104);g.append(p,c);g.addEventListener('click',()=>showItem(item,type,g));return g}
data.cities.forEach(i=>document.getElementById('citiesLayer').appendChild(makeMarker(i,'cities')));data.monasteries.forEach(i=>document.getElementById('monLayer').appendChild(makeMarker(i,'monasteries')));
function showItem(item,type,g){document.querySelectorAll('.marker.active').forEach(n=>n.classList.remove('active'));g.classList.add('active');const label=type==='monasteries'?'Монастырь':'Населённый пункт';panel.innerHTML=`<div class="eyebrow">${label}</div><h2>${item.name}</h2><div class="period">${item.period}</div><img class="hero" src="${item.img}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.textContent='Изображение недоступно в текущем подключении.'"><div class="caption">${item.caption}</div><div class="body">${item.html}</div>${type==='cities'&&item.id!=='nizhny'&&item.id!=='vysokovo'?'<div class="note">Карта подписывает населённые пункты современными названиями. Там, где нет надёжной средневековой аттестации, справка не выдаёт реконструкцию за документально установленный факт.</div>':''}<div class="sources"><strong>Источники</strong>${item.sources.map(s=>`<a href="${s}" target="_blank" rel="noopener">${s}</a>`).join('')}</div>`}
function empty(){panel.innerHTML=`<div class="empty"><div class="eyebrow">Интерактивная карта</div><h2>Выберите объект</h2><p>Нажмите на золотой маркер населённого пункта или на маркер монастыря. Движущийся пунктир показывает реконструируемое направление дороги.</p><div class="legend"><div class="legend-item"><span class="dot"></span>населённые пункты</div><div class="legend-item"><span class="dot mon"></span>монастыри</div></div></div>`}empty();
function toggle(btn,layer){const on=btn.getAttribute('aria-pressed')==='true';btn.setAttribute('aria-pressed',String(!on));document.getElementById(layer).style.display=on?'none':''}
document.getElementById('citiesToggle').addEventListener('click',e=>toggle(e.currentTarget,'citiesLayer'));document.getElementById('monToggle').addEventListener('click',e=>toggle(e.currentTarget,'monLayer'));document.getElementById('routeToggle').addEventListener('click',e=>toggle(e.currentTarget,'routeLayer'));
let scale=1,tx=0,ty=0,drag=false,sx=0,sy=0;const stage=document.getElementById('stage');const pane=document.getElementById('mapPane');function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`};document.getElementById('zoomIn').onclick=()=>{scale=Math.min(2.4,scale+.2);apply()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.8,scale-.2);apply()};document.getElementById('zoomReset').onclick=()=>{scale=1;tx=ty=0;apply()};pane.addEventListener('pointerdown',e=>{if(e.target.closest('.marker')||e.target.closest('button'))return;drag=true;sx=e.clientX-tx;sy=e.clientY-ty;pane.setPointerCapture(e.pointerId)});pane.addEventListener('pointermove',e=>{if(!drag)return;tx=e.clientX-sx;ty=e.clientY-sy;apply()});pane.addEventListener('pointerup',()=>drag=false);pane.addEventListener('pointercancel',()=>drag=false);
</script>
</body>
</html>
